name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render examples
        run: python src/render.py catalog/examples.json dist
      - name: Test renderer
        run: python -m unittest discover -s tests -v
      - name: Lint DESIGN.md
        run: npx -y @google/design.md lint DESIGN.md
